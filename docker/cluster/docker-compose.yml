volumes:

  volume-sscms:
    driver: local

services:

  reverse-proxy:
    image: "sscms/nginx"
    ports:
      - "80:80"
      - "443:443"
    restart: always

  cache:
    image: "redis"
    command: ["redis-server", "--requirepass", "${SSCMS_REDIS_PASSWORD:?set SSCMS_REDIS_PASSWORD}"]
    restart: always

  sscms:
    depends_on:
      - reverse-proxy
      - cache
    image: "sscms/core"
    expose:
      - "8080"
    environment:
      SSCMS_SECURITY_KEY: ${SSCMS_SECURITY_KEY:?set SSCMS_SECURITY_KEY}
      SSCMS_DATABASE_TYPE: SQLite
      SSCMS_REDIS_HOST: redis://:${SSCMS_REDIS_PASSWORD:?set SSCMS_REDIS_PASSWORD}@cache:6379
    volumes:
      - volume-sscms:/app/wwwroot
    restart: always

# docker-compose up -d --scale sscms=4
# docker-compose down

# Browse to: http://localhost/ss-admin/
